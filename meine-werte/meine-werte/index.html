<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: nutzt auf dem iPhone den ganzen Bildschirm (Notch); die Ränder regelt css/app.css -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meine Werte</title>
  <meta name="description" content="Private Gesundheits-App: Blutdruck, Puls, Gewicht, Symptome – alles nur lokal gespeichert.">

  <!-- Farbe der Statusleiste (iOS/Android) -->
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

  <!-- Installation als App (iOS: Zum Home-Bildschirm, Android/Desktop: Manifest) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meine Werte">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Keine Herkunftsangabe an andere Seiten senden -->
  <meta name="referrer" content="no-referrer">

  <!--
    Netzwerksperre per Content-Security-Policy: Die App darf KEINE Verbindungen zu anderen Servern
    aufbauen (connect-src 'none'), keine Plugins/Medien laden und Bilder nur von sich selbst.
    So kann auch ein eingeschleuster Code keine Daten verschicken.
    Läuft die App über start.sh / start.bat (server.py), gilt zusätzlich eine noch strengere Richtlinie
    als echter HTTP-Header (siehe server.py).
    Falls die Live-Vorschau in Phoenix Code damit nicht mehr funktioniert: diese Zeile vorübergehend
    auskommentieren (nur zum Entwickeln, nicht im Alltag).
  -->
  <meta http-equiv="Content-Security-Policy"
        content="connect-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; img-src 'self' data:; form-action 'none'">

  <!-- Hell/Dunkel setzen, bevor gezeichnet wird -->
  <script src="js/theme-init.js"></script>

  <!-- Tailwind (lokal gebaut, siehe README) + eigene Ergänzungen -->
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body class="bg-slate-100 text-slate-900 antialiased dark:bg-slate-900 dark:text-slate-100">

  <noscript>
    <p class="p-6">Diese App braucht JavaScript.</p>
  </noscript>

  <!-- Meldungen (Erfolg/Fehler) -->
  <div class="pointer-events-none fixed inset-x-0 top-0 z-50 flex justify-center px-4 safe-top">
    <div id="toast" class="mt-4" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- ============ ANMELDUNG / PROFIL ANLEGEN ============ -->
  <div id="view-auth" class="min-h-screen" hidden>
    <div class="safe-top mx-auto max-w-md p-4">
      <header class="mb-6 flex items-center justify-between pt-4">
        <h1 class="text-2xl font-bold">Meine Werte</h1>
        <button type="button" class="icon-btn" data-action="toggle-theme" data-theme-icon aria-label="Zwischen hell und dunkel wechseln"></button>
      </header>
      <div id="auth-content"></div>
      <p class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
        Alle Daten bleiben verschlüsselt auf diesem Gerät.
      </p>
    </div>
  </div>

  <!-- ============ HAUPT-APP ============ -->
  <!-- Aufbau: links Seitenleiste (nur Desktop), Mitte Inhalt, unten Leiste (nur Handy) -->
  <div id="view-app" class="min-h-screen md:flex" hidden>

    <!-- Desktop-Bereich: Seitenleiste -->
    <aside class="safe-top hidden w-60 shrink-0 flex-col border-r border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-800 md:flex">
      <h1 class="mb-6 px-3 pt-2 text-xl font-bold">Meine Werte</h1>
      <nav id="nav-side" class="flex flex-col gap-1" aria-label="Hauptnavigation"></nav>
      <div id="side-user" class="mt-auto rounded-xl bg-slate-100 p-3 text-sm dark:bg-slate-900"></div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Kopfzeile (Handy und Desktop) -->
      <header class="safe-top sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur dark:border-slate-700 dark:bg-slate-800/95">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
          <h2 id="page-title" class="text-lg font-bold"></h2>
          <div class="flex gap-1">
            <button type="button" class="icon-btn" data-action="toggle-theme" data-theme-icon aria-label="Zwischen hell und dunkel wechseln"></button>
            <button type="button" class="icon-btn" data-action="logout" aria-label="Abmelden" title="Abmelden">
              <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main id="content" class="mx-auto w-full max-w-3xl flex-1 p-4 pb-28 md:pb-10"></main>
    </div>

    <!-- Handy-Bereich (iOS/Android): Leiste unten -->
    <nav id="nav-bottom" class="safe-bottom fixed inset-x-0 bottom-0 z-20 flex border-t border-slate-200 bg-white/95 backdrop-blur dark:border-slate-700 dark:bg-slate-800/95 md:hidden" aria-label="Hauptnavigation"></nav>
  </div>

  <!-- Sichtschutz: deckt die App ab, sobald sie im Hintergrund ist (App-Umschalter, Bildschirmvorschau) -->
  <div id="privacy-cover" class="fixed inset-0 z-[60] flex flex-col items-center justify-center gap-3 bg-slate-900 p-6 text-center text-white" hidden>
    <svg class="h-12 w-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <p class="text-xl font-bold">Meine Werte</p>
    <p class="text-sm text-slate-300">Gesperrt, solange die App im Hintergrund ist.</p>
  </div>

  <!-- Reihenfolge ist wichtig: util -> vault -> store -> charts -> app -->
  <script src="js/util.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
